[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ryujin-iii-lcd-linux"
version = "0.1.0"
description = "Drive the ASUS ROG Ryujin III AIO cooler's 3.5\" LCD from Linux"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["pyusb>=1.0"]

[project.optional-dependencies]
images = ["Pillow"]

[project.scripts]
ryujin-lcd = "ryujin_lcd.cli:main"
ryujin-lcd-monitor = "ryujin_lcd.monitor:main"
ryujin-lcd-web = "ryujin_lcd.web:main"

[tool.setuptools]
packages = ["ryujin_lcd"]

[tool.setuptools.package-data]
ryujin_lcd = ["static/*"]
